<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Poppin' Bubbally</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    #container { position: fixed; inset: 0; touch-action: none; cursor: crosshair; }
    #container canvas { display: block; }

    #hint {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 10;
      font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.08em;
      color: #999; background: rgba(20, 20, 20, 0.55); border: 0; border-radius: 8px;
      padding: 8px 12px; pointer-events: none; backdrop-filter: blur(6px);
      transition: opacity 0.6s;
    }
    #hint.gone { opacity: 0; }
  </style>
</head>
<body>

  <div id="container"></div>

  <div id="hint">click a bubble</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import * as CANNON from 'cannon-es';

  // Rebuilt after Lars Berg's "poppin' bubbally" (May 2016).
  // Numbers below are the sketch's own animation attributes.
  const attr = {
    goalWeight: 2,                           // pull toward the goal, per frame
    goal: new THREE.Vector3(0, -130, 0),
    cam: { y: -400, z: -600, rad: 200 },     // rad: invisible sphere that keeps bubbles off the lens
    bubble: {
      count: 130,
      radius: { min: 10, max: 70 },
      life: { min: 6000, max: 20000 },       // ms until a bubble pops by itself
      y: { min: -5000, max: -1250 },         // where popped bubbles respawn (far below)
    },
    blast: { falloff: 100, vel: { max: 100, min: 0.1 } },
    bloom: { scale: 0.25, iterations: 6, opacity: 0.75, blurScale: 1.05, blurStep: 1.25 },
    burst: { count: 100, time: 500 },
  };

  const { randFloat: randf, mapLinear: remap, clamp } = THREE.MathUtils;
  const cubicOut = (t) => --t * t * t + 1;

  // ---------------------------------------------------------------- shaders

  // Ashima simplex noise (MIT), as used by the original.
  const NOISE = /* glsl */`
    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
    float snoise(vec3 v) {
      const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
      const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
      vec3 i  = floor(v + dot(v, C.yyy));
      vec3 x0 = v - i + dot(i, C.xxx);
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy);
      vec3 i2 = max(g.xyz, l.zxy);
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod289(i);
      vec4 p = permute(permute(permute(
                i.z + vec4(0.0, i1.z, i2.z, 1.0))
              + i.y + vec4(0.0, i1.y, i2.y, 1.0))
              + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      float n_ = 0.142857142857;
      vec3 ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);
      vec4 x = x_ * ns.x + ns.yyyy;
      vec4 y = y_ * ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4(x.xy, y.xy);
      vec4 b1 = vec4(x.zw, y.zw);
      vec4 s0 = floor(b0) * 2.0 + 1.0;
      vec4 s1 = floor(b1) * 2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
      vec3 p0 = vec3(a0.xy, h.x);
      vec3 p1 = vec3(a0.zw, h.y);
      vec3 p2 = vec3(a1.xy, h.z);
      vec3 p3 = vec3(a1.zw, h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
      m = m * m;
      return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
    }
  `;

  // The bubble: a sphere wobbled by noise (more when it moves fast), lit by an
  // environment map sampled through the view-space normal with the green and
  // blue channels slightly shrunk for the rainbow fringe, tinted by a drifting
  // "film" texture, and a fresnel-driven colour ramp.
  const BUBBLE_VERT = NOISE + /* glsl */`
    uniform float speed;
    varying vec3 vNormal;
    varying vec2 vUv;
    varying vec4 mvPosition;

    vec3 normalFrom3Points(vec3 p0, vec3 p1, vec3 p2) { return normalize(cross(p2 - p1, p0 - p1)); }

    vec3 displace(vec3 p, vec3 center) {
      float n = snoise(p * 0.4 + center) * 0.5 + 0.3;
      return p * (1.0 + n * speed * 2.0);
    }

    void main() {
      vUv = uv;
      vec3 center = (modelMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz * 0.00125;

      // tangent of the unit sphere along u (any sign works for the normal below)
      vec3 t = cross(vec3(0.0, 1.0, 0.0), normal);
      t = dot(t, t) < 1e-6 ? vec3(1.0, 0.0, 0.0) : normalize(t);

      vec3 p0 = displace(position, center);
      vec3 p1 = displace(normalize(position + t * 0.01), center);
      vec3 p2 = displace(normalize(position + cross(t, normal) * 0.01), center);

      mvPosition = modelViewMatrix * vec4(p0, 1.0);
      vNormal = normalize(normalMatrix * normalFrom3Points(p0, p2, p1));
      gl_Position = projectionMatrix * mvPosition;
    }
  `;

  const BUBBLE_FRAG = /* glsl */`
    uniform sampler2D map;
    uniform sampler2D ramp;
    uniform sampler2D envmap;
    varying vec3 vNormal;
    varying vec2 vUv;
    varying vec4 mvPosition;

    void main() {
      float fr = abs(dot(normalize(mvPosition.xyz), -vNormal));
      float mfr = 1.0 - fr;

      vec2 uv = vNormal.xy;
      vec3 c = texture2D(envmap, uv * 0.5 + 0.5).xyz;
      c.y = texture2D(envmap, uv * 0.97 * 0.5 + 0.5).y;
      c.z = texture2D(envmap, uv * 0.94 * 0.5 + 0.5).z;

      c *= (vNormal.y * 0.5 + 0.75) * 4.0;
      c *= texture2D(map, vUv).xyz;

      float mixVal = pow(mfr * 1.5, 3.0);
      float alpha = (mixVal * 0.5 + 0.5) - fr * fr * 0.4;

      gl_FragColor = vec4(mix(c, c * 0.25, 1.0 - mixVal), alpha);
      gl_FragColor *= texture2D(ramp, vec2(fr * fr, 0.5)) * 0.7 + 0.3;
    }
  `;

  const QUAD_VERT = /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
  `;

  // Drifting colour noise on a sphere, rendered to a small texture every frame.
  const FILM_FRAG = NOISE + /* glsl */`
    #define PI 3.14159265359
    #define TWO_PI 6.28318530718
    uniform float time;
    varying vec2 vUv;
    void main() {
      vec3 c = vec3(0.0);
      vec2 uv = vUv * vec2(TWO_PI, PI);
      vec3 p = vec3(cos(uv.x) * sin(uv.y), cos(uv.y), sin(uv.x) * sin(uv.y));
      c.xz += abs(snoise(p + vec3(0.0, time * 0.25, 0.0)));
      c.yz += abs(snoise(p + vec3(0.0, time * 0.5, 0.0)));
      c.xy += abs(snoise(p + vec3(0.0, time, 0.0)));
      gl_FragColor = vec4(c + 0.25, 1.0);
    }
  `;

  const PARTICLE_VERT = /* glsl */`
    uniform float radius;
    uniform float radScl;
    void main() {
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      gl_PointSize = max(0.1, radius * radScl * (1000.0 / length(mvPosition.xyz)));
    }
  `;

  const PARTICLE_FRAG = /* glsl */`
    void main() {
      vec2 uv = gl_PointCoord.xy * 2.0 - 1.0;
      float d = max(0.0, dot(uv, uv));
      float u = d * d * d;
      gl_FragColor = vec4(vec3(0.7, 0.73, 0.79), mix(0.0, u < 1.0 ? 1.0 : 0.0, u));
    }
  `;

  const BLUR_FRAG = /* glsl */`
    uniform sampler2D tDiffuse;
    uniform vec2 resolution;
    uniform vec2 direction;
    uniform float blurScale;
    varying vec2 vUv;
    void main() {
      vec2 off1 = vec2(1.3846153846) * direction / resolution;
      vec2 off2 = vec2(3.2307692308) * direction / resolution;
      vec4 c = texture2D(tDiffuse, vUv) * 0.2270270270;
      c += texture2D(tDiffuse, vUv + off1) * 0.3162162162;
      c += texture2D(tDiffuse, vUv - off1) * 0.3162162162;
      c += texture2D(tDiffuse, vUv + off2) * 0.0702702703;
      c += texture2D(tDiffuse, vUv - off2) * 0.0702702703;
      gl_FragColor = c * blurScale;
    }
  `;

  const OVERLAY_FRAG = /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float opacity;
    varying vec2 vUv;
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      gl_FragColor = vec4(c.xyz, c.w * opacity);
    }
  `;

  // ---------------------------------------------------------------- textures

  // Deterministic random for the generated textures.
  function mulberry32(a) {
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // A night-time panorama: dark blue sky, a dusky band at the horizon strung
  // with small coloured lights, dark ground. Replaces the original's photo.
  function makeEnvTexture() {
    const w = 1024, h = 512;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    const rnd = mulberry32(20160506);
    const rand = (a, b) => a + rnd() * (b - a);

    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0.00, '#04060e');
    sky.addColorStop(0.28, '#0c1a3c');
    sky.addColorStop(0.44, '#1e3a72');
    sky.addColorStop(0.49, '#6a5570');
    sky.addColorStop(0.505, '#c98a6a');
    sky.addColorStop(0.53, '#2a1c20');
    sky.addColorStop(0.72, '#120e10');
    sky.addColorStop(1.00, '#07060a');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    // a few soft cloud/dusk patches
    for (let i = 0; i < 14; i++) {
      const x = rand(0, w), y = rand(h * 0.15, h * 0.48), r = rand(60, 220);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      const warm = y > h * 0.36;
      g.addColorStop(0, warm ? 'rgba(200,120,110,0.18)' : 'rgba(120,150,220,0.16)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }

    // stars
    for (let i = 0; i < 400; i++) {
      ctx.fillStyle = `rgba(255,255,255,${rand(0.15, 0.9).toFixed(2)})`;
      const s = rnd() < 0.1 ? 2 : 1;
      ctx.fillRect(rand(0, w), rand(0, h * 0.44), s, s);
    }

    // lights along the horizon
    const colours = ['#ffd9a0', '#ffb060', '#ff7a3c', '#ffffff', '#8fd3ff', '#ff8fd0', '#ffe86a', '#a0ffcc'];
    for (let i = 0; i < 320; i++) {
      const x = rand(0, w), y = h * 0.5 + rand(-6, 22);
      const col = colours[Math.floor(rnd() * colours.length)];
      const r = rand(0.8, 3.2);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
      g.addColorStop(0, col);
      g.addColorStop(0.25, col.replace('#', '#').concat('66'));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }

    // a handful of bright fires / floodlights
    for (let i = 0; i < 6; i++) {
      const x = rand(0, w), y = h * 0.5 + rand(-2, 10), r = rand(18, 40);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(255,240,210,1)');
      g.addColorStop(0.15, 'rgba(255,170,80,0.9)');
      g.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }

  // Fresnel colour ramp, sampled from the original's ramp.png along its diagonal.
  function makeRampTexture() {
    const stops = ['#3a3a3a', '#404040', '#b1b1b1', '#fefeff', '#99b5ff', '#3b71ff', '#e68657', '#f4f4f4'];
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 1;
    const ctx = canvas.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 256, 0);
    stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 256, 1);
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.minFilter = tex.magFilter = THREE.LinearFilter;
    return tex;
  }

  // ---------------------------------------------------------------- renderer

  const container = document.getElementById('container');
  const hint = document.getElementById('hint');
  const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  hint.textContent = touch ? 'tap a bubble' : 'click a bubble';

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 1);
  renderer.autoClear = false;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
  camera.position.set(0, attr.cam.y, attr.cam.z);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableZoom = false;
  controls.enableRotate = false;
  controls.enablePan = true;
  controls.enableDamping = true;
  controls.dampingFactor = 0.5;
  controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN };
  controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.PAN };
  controls.target.set(0, attr.cam.y, 0);

  const clock = new THREE.Clock();
  const quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  function quadScene(material) {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    mesh.frustumCulled = false;
    const s = new THREE.Scene();
    s.add(mesh);
    return s;
  }

  // film texture
  const filmTarget = new THREE.WebGLRenderTarget(256, 128);
  const filmMaterial = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 } },
    vertexShader: QUAD_VERT, fragmentShader: FILM_FRAG, depthTest: false, depthWrite: false,
  });
  const filmScene = quadScene(filmMaterial);

  // bloom: draw the scene small, blur it a few times, add it back on top
  const bloom = (() => {
    const opts = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter };
    let read = new THREE.WebGLRenderTarget(1, 1, opts);
    let write = new THREE.WebGLRenderTarget(1, 1, opts);
    const blurMaterial = new THREE.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: null }, direction: { value: new THREE.Vector2(1, 0) },
        resolution: { value: new THREE.Vector2(1, 1) }, blurScale: { value: attr.bloom.blurScale },
      },
      vertexShader: QUAD_VERT, fragmentShader: BLUR_FRAG, depthTest: false, depthWrite: false,
    });
    const overlayMaterial = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, opacity: { value: attr.bloom.opacity } },
      vertexShader: QUAD_VERT, fragmentShader: OVERLAY_FRAG,
      transparent: true, blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false,
    });
    const blurScene = quadScene(blurMaterial);
    const overlayScene = quadScene(overlayMaterial);

    function pass(material) {
      material.uniforms.tDiffuse.value = read.texture;
      renderer.setRenderTarget(write);
      renderer.clear();
      renderer.render(material === blurMaterial ? blurScene : overlayScene, quadCamera);
      [read, write] = [write, read];
    }

    return {
      setSize(w, h) {
        read.setSize(w, h); write.setSize(w, h);
        blurMaterial.uniforms.resolution.value.set(w, h);
      },
      render(scene, camera) {
        renderer.setRenderTarget(read);
        renderer.clear();
        renderer.render(scene, camera);
        for (let i = 0; i < attr.bloom.iterations; i++) {
          blurMaterial.uniforms.direction.value.set(attr.bloom.blurStep, 0);
          pass(blurMaterial);
          blurMaterial.uniforms.direction.value.set(0, attr.bloom.blurStep);
          pass(blurMaterial);
        }
        overlayMaterial.uniforms.tDiffuse.value = read.texture;
        renderer.setRenderTarget(null);
        renderer.render(overlayScene, quadCamera);
      },
    };
  })();

  // ---------------------------------------------------------------- audio

  // Synthesized "blop": a short sine whose pitch swoops up, sized by the
  // bubble and panned by where it is. Replaces the original's Blop.mp3.
  const audio = (() => {
    let ctx = null, merger = null;
    const leftPos = new THREE.Vector3(350, 0, 0);
    const rightPos = new THREE.Vector3(-350, 0, 0);
    const threshold = 600;

    function start() {
      if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -3; limiter.knee.value = 0; limiter.ratio.value = 20;
      limiter.attack.value = 0.001; limiter.release.value = 0.1;
      limiter.connect(ctx.destination);
      const master = ctx.createGain();
      master.gain.value = 0.32;               // about -10 dB
      master.connect(limiter);
      merger = ctx.createChannelMerger(2);
      merger.connect(master);
    }

    function blop(b, { pitch, lo, hi, floor }) {
      if (!ctx || ctx.state !== 'running') return;
      const t = ctx.currentTime;
      const f = remap(b.radius, attr.bubble.radius.min, attr.bubble.radius.max, 1500, 320) * pitch;

      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f * 0.6, t);
      osc.frequency.exponentialRampToValueAtTime(f, t + 0.025);
      osc.frequency.exponentialRampToValueAtTime(f * 1.7, t + 0.13);

      const env = ctx.createGain();
      env.gain.setValueAtTime(0.0001, t);
      env.gain.exponentialRampToValueAtTime(1, t + 0.004);
      env.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      osc.connect(env);
      osc.start(t); osc.stop(t + 0.16);

      // each ear hears bubbles near it; far-off pops fade out
      const ears = [[leftPos, 0], [rightPos, 1]];
      for (const [pos, channel] of ears) {
        const v = clamp(remap(pos.distanceTo(b.position), 0, threshold, hi, lo), floor, 1);
        if (v <= 0) continue;
        const g = ctx.createGain();
        g.gain.value = v;
        env.connect(g);
        g.connect(merger, 0, channel);
      }
    }

    return {
      start,
      pop: (b) => blop(b, { pitch: 1, hi: 0.4, lo: -0.4, floor: 0 }),        // a bubble popping on its own
      burst: (b) => blop(b, { pitch: 1.6, hi: 1, lo: 0.1, floor: 0.25 }),   // one you popped
    };
  })();

  // ---------------------------------------------------------------- physics

  const world = new CANNON.World({ gravity: new CANNON.Vec3(0, 0, 0) });
  world.broadphase = new CANNON.NaiveBroadphase();

  const bubbleMaterial = new CANNON.Material('bubble');
  world.addContactMaterial(new CANNON.ContactMaterial(bubbleMaterial, bubbleMaterial, { friction: 0, restitution: 0 }));

  // a ceiling at y = 0 the bubbles pile up under
  const ceiling = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: bubbleMaterial });
  ceiling.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), Math.PI / 2);
  world.addBody(ceiling);

  // the camera pushes bubbles out of its way
  const camBody = new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(attr.cam.rad), material: bubbleMaterial });
  world.addBody(camBody);

  // ---------------------------------------------------------------- bubbles

  const envTexture = makeEnvTexture();
  const rampTexture = makeRampTexture();

  function bubbleMaterialFor(side) {
    return new THREE.ShaderMaterial({
      uniforms: {
        map: { value: filmTarget.texture }, ramp: { value: rampTexture }, envmap: { value: envTexture },
        speed: { value: 0 },
      },
      vertexShader: BUBBLE_VERT, fragmentShader: BUBBLE_FRAG,
      transparent: true, blending: THREE.NormalBlending, depthTest: true, depthWrite: false, side,
    });
  }
  // Drawn twice per frame: insides first, then the fronts over them.
  const backMaterial = bubbleMaterialFor(THREE.BackSide);
  const frontMaterial = bubbleMaterialFor(THREE.FrontSide);

  const bubbleGeometry = new THREE.SphereGeometry(1, 40, 20);
  const bubbleGroup = new THREE.Scene();
  scene.add(bubbleGroup);
  const bubbles = bubbleGroup.children;

  function addBubble(pos) {
    const r = remap(cubicOut(Math.random()), 0, 1, attr.bubble.radius.min, attr.bubble.radius.max);
    const m = new THREE.Mesh(bubbleGeometry, frontMaterial);
    m.position.copy(pos);
    m.scale.setScalar(r);
    m.radius = r;
    m.speed = 0;
    m.onBeforeRender = (renderer, scene, camera, geometry, material) => { material.uniforms.speed.value = m.speed; };
    m.body = new CANNON.Body({
      mass: r * r, shape: new CANNON.Sphere(r), material: bubbleMaterial,
      position: new CANNON.Vec3(pos.x, pos.y, pos.z),
    });
    world.addBody(m.body);
    bubbleGroup.add(m);
    m.timeout = setTimeout(() => popBubble(m), randf(attr.bubble.life.min, attr.bubble.life.max));
  }

  function randomSpawn() {
    return new THREE.Vector3(randf(-500, 500), randf(attr.bubble.y.min, attr.bubble.y.max), randf(-350, 350));
  }

  for (let i = 0; i < attr.bubble.count; i++) addBubble(randomSpawn());

  // the first one is always the biggest size
  bubbles[0].radius = attr.bubble.radius.max;
  bubbles[0].scale.setScalar(attr.bubble.radius.max);
  bubbles[0].body.shapes[0].radius = attr.bubble.radius.max;
  bubbles[0].body.updateBoundingRadius();

  // ---------------------------------------------------------------- burst particles

  const burst = (() => {
    const group = new THREE.Group();
    scene.add(group);
    const positions = new Float32Array(attr.burst.count * 3);
    for (let i = 0; i < attr.burst.count; i++) {
      const v = new THREE.Vector3(Math.random(), Math.random(), Math.random()).addScalar(-0.5).normalize();
      v.toArray(positions, i * 3);
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const baseMaterial = new THREE.ShaderMaterial({
      uniforms: { radius: { value: 1 }, radScl: { value: renderer.getPixelRatio() } },
      vertexShader: PARTICLE_VERT, fragmentShader: PARTICLE_FRAG,
      transparent: true, blending: THREE.NormalBlending, depthTest: false, depthWrite: false,
    });
    const active = [];

    return {
      pop(r, pos) {
        const material = baseMaterial.clone();
        const points = new THREE.Points(geometry, material);
        points.position.copy(pos);
        points.scale.setScalar(r);
        points.frustumCulled = false;
        group.add(points);
        const s = r * (Math.random() * 0.5 + 0.5);
        active.push({
          points, start: performance.now(),
          from: { radius: r * 0.05, scale: r, y: pos.y, rx: 0, ry: 0 },
          to: { radius: 0, scale: s, y: pos.y - Math.random() * 10 - 10, rx: (Math.random() - 0.5), ry: (Math.random() - 0.5) },
        });
      },
      update(now) {
        for (let i = active.length - 1; i >= 0; i--) {
          const a = active[i];
          const t = cubicOut(Math.min(1, (now - a.start) / attr.burst.time));
          const mix = (k) => a.from[k] + (a.to[k] - a.from[k]) * t;
          a.points.material.uniforms.radius.value = mix('radius');
          a.points.scale.setScalar(mix('scale'));
          a.points.position.y = mix('y');
          a.points.rotation.set(mix('rx'), mix('ry'), 0);
          if (t >= 1) {
            group.remove(a.points);
            a.points.material.dispose();
            active.splice(i, 1);
          }
        }
      },
    };
  })();

  // ---------------------------------------------------------------- popping

  // A bubble pops: sound, a puff of particles, and it respawns far below.
  function popBubble(b) {
    audio.pop(b);
    burst.pop(b.radius, b.position);
    const p = randomSpawn();
    b.body.position.set(p.x, p.y, p.z);   // keeps its velocity, as in the original
    clearTimeout(b.timeout);
    b.timeout = setTimeout(() => popBubble(b), randf(attr.bubble.life.min, attr.bubble.life.max));
  }

  // You popped one: louder, and the others get shoved away from it.
  const delta = new THREE.Vector3();
  function blastBubble(b) {
    audio.burst(b);
    const origin = b.position.clone();
    popBubble(b);
    for (const s of bubbles) {
      if (s === b) continue;
      delta.copy(s.position).sub(origin);
      let v = 1 - clamp(attr.blast.falloff / delta.length(), 0, 1);
      v = remap(v * v, 0, 1, attr.blast.vel.max, attr.blast.vel.min);
      delta.normalize().multiplyScalar(v);
      s.body.velocity.x += delta.x;
      s.body.velocity.y += delta.y;
      s.body.velocity.z += delta.z;
    }
  }

  // ---------------------------------------------------------------- input

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let press = null;

  container.addEventListener('pointerdown', (e) => {
    audio.start();
    press = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  container.addEventListener('pointerup', (e) => {
    if (!press) return;
    const moved = Math.hypot(e.clientX - press.x, e.clientY - press.y);
    const held = performance.now() - press.t;
    press = null;
    if (moved > 8 || held > 600) return;           // that was a drag, not a click
    popAt(e.clientX, e.clientY);
  });

  function popAt(x, y) {
    pointer.x = (x / window.innerWidth) * 2 - 1;
    pointer.y = -(y / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hit = raycaster.intersectObjects(bubbles, false)[0];
    if (!hit) return false;
    blastBubble(hit.object);
    hint.classList.add('gone');
    return true;
  }
  window.addEventListener('keydown', () => audio.start(), { once: true });

  // ---------------------------------------------------------------- loop

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    bloom.setSize(Math.max(1, Math.round(w * attr.bloom.scale)), Math.max(1, Math.round(h * attr.bloom.scale)));
  }
  window.addEventListener('resize', resize);
  resize();

  function update() {
    burst.update(performance.now());
    controls.update();
    world.step(1 / 60);
    camBody.position.set(camera.position.x, camera.position.y, camera.position.z);

    for (const m of bubbles) {
      // wobble more when moving fast, settle when slow
      m.speed *= 0.975;
      m.speed += 0.025 * Math.min(1, m.body.velocity.length() / 1000);

      m.position.copy(m.body.position);
      m.quaternion.copy(m.body.quaternion);

      // accelerate toward the goal (the original meant to damp velocity too,
      // but cannon's scale() returns a copy, so it never did; the free
      // acceleration and collisions are what make the cluster jostle)
      delta.copy(m.position).sub(attr.goal).normalize().multiplyScalar(-attr.goalWeight);
      m.body.velocity.x += delta.x;
      m.body.velocity.y += delta.y;
      m.body.velocity.z += delta.z;
    }
  }

  function draw() {
    filmMaterial.uniforms.time.value = clock.getElapsedTime();
    renderer.setRenderTarget(filmTarget);
    renderer.clear();
    renderer.render(filmScene, quadCamera);

    renderer.setRenderTarget(null);
    renderer.clear();
    for (const m of bubbles) m.material = backMaterial;
    renderer.render(scene, camera);
    for (const m of bubbles) m.material = frontMaterial;
    renderer.render(bubbleGroup, camera);

    bloom.render(scene, camera);
  }

  function frame() {
    requestAnimationFrame(frame);
    update();
    draw();
  }
  frame();
  </script>
</body>
</html>
