<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funrun</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="paint" aria-hidden="true"></canvas>

  <button id="hint" type="button">press d for controls</button>

  <div id="debug">
    <label>time <input id="dbg-time" type="range" min="0" max="25" step="0.01" value="0"><span></span></label>
    <label>speed <input id="dbg-speed" type="range" min="0.01" max="5" step="0.01" value="1"><span></span></label>
    <label>speed variation <input id="dbg-speedvar" type="range" min="0" max="4" step="0.01" value="1"><span></span></label>
    <label>size variation <input id="dbg-sizevar" type="range" min="0" max="4" step="0.01" value="1"><span></span></label>
    <label>noise scale <input id="dbg-noise" type="range" min="0.1" max="5" step="0.01" value="1"><span></span></label>
    <label>drip size <input id="dbg-size" type="range" min="0.1" max="6" step="0.01" value="1"><span></span></label>
    <label>run length <input id="dbg-runlen" type="range" min="0" max="8" step="0.01" value="1"><span></span></label>
    <label>thin ↔ thick <input id="dbg-thick" type="range" min="0" max="4" step="0.01" value="1"><span></span></label>
    <label>logo size <input id="dbg-logo" type="range" min="0.05" max="1.5" step="0.01" value="0.62"><span></span></label>
    <label>shading <input id="dbg-gloss" type="range" min="0" max="3" step="0.01" value="0"><span></span></label>
    <label><input id="dbg-pause" type="checkbox"> pause timeline</label>
    <div class="row"><button id="dbg-restart" type="button">↻ restart</button><span class="hint">press d to hide</span></div>
  </div>

  <script src="paint.js"></script>
</body>
</html>
