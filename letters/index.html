<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Letters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: linear-gradient(#e6eaf5 0%, #f6f6f6 80%);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      overscroll-behavior: none;
    }
    p { margin: 0; }
    #container { position: fixed; inset: 0; z-index: 1; touch-action: none; cursor: pointer; }
    #container canvas { display: block; }

    /* Typographic underlay behind the canvas, after the original's layout. */
    .layer { position: fixed; inset: 0; padding: 40px; pointer-events: none; color: #000; }
    .under { z-index: 0; }
    .over { z-index: 2; }
    .row { display: flex; align-items: flex-start; }
    .row > * { flex: 1 1 0; }
    .right { text-align: right; }
    .center { text-align: center; }
    .brand { font: 700 30px/30px Antonio, sans-serif; letter-spacing: -2px; text-transform: uppercase; }
    .label { font-size: 12px; line-height: 1.5em; }
    .label b { font-weight: 600; }
    .dash { width: 10px; height: 1px; background: #000; margin-top: 8px; }
    .big {
      position: absolute; left: 40px; right: 40px; bottom: 100px;
      display: flex; justify-content: space-between; align-items: flex-end;
      font: 600 250px/0.8 Antonio, sans-serif; letter-spacing: -7px;
    }
    .bottom { position: absolute; left: 40px; right: 40px; bottom: 40px; align-items: flex-end; }
    .tag { font: 600 13px/1 Antonio, sans-serif; letter-spacing: -0.5px; text-transform: uppercase; }
    .side {
      position: absolute; right: 40px; top: 105px; display: flex; flex-direction: column;
      align-items: center; gap: 18px;
    }
    .side span { writing-mode: vertical-rl; font-weight: 600; font-size: 11px; letter-spacing: 0.04em; }
    .side i { width: 8px; height: 8px; border-radius: 50%; background: #000; }
    .bottom a { pointer-events: auto; color: #000; text-decoration: none; font-size: 12px; margin-left: 14px; }

    /* Track button, top centre: outlined when stopped, filled while playing. */
    .top { position: absolute; left: 0; right: 0; top: 34px; display: flex; justify-content: center; }
    .play {
      pointer-events: auto; cursor: pointer; display: inline-flex; align-items: center; gap: 9px;
      height: 42px; padding: 0 18px 0 14px; border: 1.5px solid #000; border-radius: 21px;
      background: rgba(255, 255, 255, 0.6); color: #000; backdrop-filter: blur(6px);
      font: 700 24px/1 Antonio, sans-serif; letter-spacing: -1px;
      transition: background 0.2s, color 0.2s, transform 0.08s;
    }
    .play:active { transform: scale(0.96); }
    .play:focus-visible { outline: 2px solid #000; outline-offset: 3px; }
    .play svg { width: 12px; height: 12px; fill: currentColor; }
    .play .pause { display: none; }
    .play[aria-pressed="true"] { background: #000; color: #fff; }
    .play[aria-pressed="true"] .tri { display: none; }
    .play[aria-pressed="true"] .pause { display: block; }
    .play[data-loading] { opacity: 0.5; cursor: progress; }
    @media (max-width: 568px) {
      .layer { padding: 16px; }
      .big { left: 16px; right: 16px; bottom: 80px; font-size: 140px; letter-spacing: -4px; }
      .bottom { left: 16px; right: 16px; bottom: 16px; }
      .side { right: 16px; top: 80px; }
      .full { display: none; }
    }
  </style>
</head>
<body>

  <div class="layer under">
    <div class="row">
      <p class="brand">funrun</p>
      <p></p>
      <p></p>
    </div>
    <div style="height: 60px"></div>
    <div class="row">
      <div class="label">
        <p><b>The Letters</b></p>
        <p>Three Fiber</p>
        <div class="dash"></div>
      </div>
      <p></p>
      <p></p>
    </div>
    <div class="big"><p>X</p><p>_30</p></div>
    <div class="row bottom">
      <div class="label full">
        <p><b>Physics, Effects</b></p>
        <p>Lights and Colors</p>
      </div>
      <p class="tag center full">Fifty of them, drifting</p>
      <p class="right"></p>
    </div>
  </div>

  <div id="container"></div>

  <div class="layer over">
    <div class="top">
      <button class="play" id="play" type="button" aria-pressed="false" aria-label="Play track 1">
        <svg class="tri" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z"/></svg>
        <svg class="pause" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>
        <span>1</span>
      </button>
    </div>
    <div class="side"><span>DRAG POINTER</span><i></i></div>
    <div class="row bottom">
      <p></p><p></p>
      <p class="right"><a href="../">funrun</a></p>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js",
      "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.36.4/build/index.js",
      "n8ao": "https://cdn.jsdelivr.net/npm/n8ao@1.9.4/dist/N8AO.js"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import * as CANNON from 'cannon-es';
  import { EffectComposer, RenderPass, EffectPass, ToneMappingEffect, ToneMappingMode, SMAAEffect } from 'postprocessing';
  import { N8AOPostPass } from 'n8ao';

  // Rebuilt after Paul Henschel's "Best Served Bold" baubles (pmndrs, 2020).
  // Fifty spheres in a zero-gravity world, each nudged toward the origin every
  // frame (three times harder vertically, so the cluster comes out wide), with
  // a kinematic ball under the cursor shoving them aside.
  const COUNT = 50;
  const SCALES = [0.75, 0.75, 1, 1, 1.25];
  const PULL = new THREE.Vector3(-50, -150, -50);   // impulse per second, times scale
  const POINTER_RADIUS = 2;
  const FOV = 32.5, CAM_Z = 20;

  const container = document.getElementById('container');

  // ---------------------------------------------------------------- renderer

  const renderer = new THREE.WebGLRenderer({
    alpha: true, antialias: false, stencil: false, depth: false,
    powerPreference: 'high-performance',
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 1, 100);
  camera.position.set(0, 0, CAM_Z);

  // No HDR file: a generated studio room stands in for the original's panorama.
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environment = envMap;

  // ---------------------------------------------------------------- lights

  scene.add(new THREE.AmbientLight(0xffffff, 0.5 * Math.PI));

  const spot = new THREE.SpotLight(0xffffff, Math.PI, 0, 0.2, 1, 0);
  spot.position.set(30, 30, 30);
  spot.castShadow = true;
  spot.shadow.mapSize.set(512, 512);
  spot.shadow.camera.near = 20;
  spot.shadow.camera.far = 80;
  spot.shadow.bias = -0.0005;
  scene.add(spot, spot.target);

  // ---------------------------------------------------------------- meshes

  // Glossy white balls, each with a letter painted on, after the pmndrs
  // "object clump" example (which uses a brushed X). The letters are drawn on a
  // canvas in equirectangular space, so they sit undistorted on the equator.
  // Change LETTERS to pick what goes on the balls; one is picked at random per ball.
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const FONT = '700 170px Antonio, "Arial Narrow", sans-serif';
  await document.fonts.load(FONT).catch(() => {});  // the canvas only sees loaded fonts

  function makeLetterTexture(ch) {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = '#fff';
    g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#000';
    g.font = FONT;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(ch, 512, 262);                        // canvas centre = front of the ball

    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  // One material per distinct letter, shared by every ball that shows it.
  const letterMaterials = new Map();
  function letterMaterial(ch) {
    if (!letterMaterials.has(ch)) {
      letterMaterials.set(ch, new THREE.MeshStandardMaterial({
        color: 'white', roughness: 0, envMapIntensity: 1, map: makeLetterTexture(ch),
      }));
    }
    return letterMaterials.get(ch);
  }
  const randomLetter = () => LETTERS[Math.floor(Math.random() * LETTERS.length)];

  const sphereGeometry = new THREE.SphereGeometry(1, 32, 32);

  // ---------------------------------------------------------------- physics

  const world = new CANNON.World({ gravity: new CANNON.Vec3(0, 0, 0) });
  world.broadphase = new CANNON.SAPBroadphase(world);
  world.allowSleep = false;
  world.solver.iterations = 8;
  const mat = new CANNON.Material('bauble');
  world.addContactMaterial(new CANNON.ContactMaterial(mat, mat, {
    friction: 0.2, restitution: 0,
    contactEquationStiffness: 1e7, contactEquationRelaxation: 3,
  }));
  world.defaultContactMaterial.friction = 0.2;
  world.defaultContactMaterial.restitution = 0;

  // rapier damps v by 1/(1 + dt*d); cannon by (1 - d)^dt. Match the per-second decay.
  const damp = (d) => 1 - Math.exp(-d);

  const spread = THREE.MathUtils.randFloatSpread;

  const baubles = [];
  for (let i = 0; i < COUNT; i++) {
    const s = SCALES[Math.floor(Math.random() * SCALES.length)];
    const body = new CANNON.Body({
      mass: (4 / 3) * Math.PI * s * s * s,           // density 1, as rapier would compute
      material: mat,
      linearDamping: damp(0.75),
      angularDamping: damp(0.15),
      position: new CANNON.Vec3(spread(20), spread(20) - 25, spread(20) - 10),
    });
    body.addShape(new CANNON.Sphere(s));
    body.quaternion.setFromEuler(Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28);
    world.addBody(body);

    const group = new THREE.Mesh(sphereGeometry, letterMaterial(randomLetter()));
    group.scale.setScalar(s);
    group.castShadow = group.receiveShadow = true;
    scene.add(group);

    baubles.push({ body, group, s });
  }

  // Kinematic ball that follows the cursor across the z = 0 plane.
  const pointerBody = new CANNON.Body({ type: CANNON.Body.KINEMATIC, material: mat });
  pointerBody.addShape(new CANNON.Sphere(POINTER_RADIUS));
  world.addBody(pointerBody);

  const mouse = new THREE.Vector2(0, 0);
  const pointerTarget = new THREE.Vector3();
  const pointerPos = new THREE.Vector3();
  window.addEventListener('pointermove', (e) => {
    mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  });

  // Click or tap a ball to flick it away from where it was hit. Rolling over
  // the cluster with a brisk sweep (about 0.75 s across the screen) knocks a
  // ball to roughly ROLLOVER_SPEED; a click is 25% harder. The push points from
  // the hit point through the centre, so clicking a ball's edge sends it sideways.
  const ROLLOVER_SPEED = 28;                         // measured peak speed from a brisk sweep
  const CLICK_SPEED = ROLLOVER_SPEED * 1.25;
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const ballMeshes = baubles.map((b) => b.group);
  const meshToBody = new Map(baubles.map((b) => [b.group, b.body]));
  renderer.domElement.addEventListener('pointerdown', (e) => {
    ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    camera.updateMatrixWorld();                      // in case no frame has rendered yet
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObjects(ballMeshes, false)[0];
    if (!hit) return;
    const body = meshToBody.get(hit.object);
    const c = body.position;
    const dir = new THREE.Vector3(c.x, c.y, c.z).sub(hit.point).normalize();   // into the ball
    body.applyImpulse(new CANNON.Vec3(dir.x, dir.y, dir.z).scale(body.mass * CLICK_SPEED));
  });

  // ---------------------------------------------------------------- audio

  // Button "1" loops a drum track. The spectrum is split into log-spaced
  // bands and each ball listens to one of them. When its band jumps above its
  // own recent average (a hit), the ball is bounced outward from the centre, so
  // kicks, snares and hats each move a different set of balls. A hit raises
  // the ball's outward speed to the kick speed rather than adding to it, each
  // band waits a moment before it can fire again, and only balls near the
  // cluster get kicked, so the pile bounces in place instead of drifting apart.
  const TRACK_URL = 'track-1.wav';
  const BANDS = 8;
  const BAND_LO = 40, BAND_HI = 12000;               // Hz
  const ONSET_FLOOR = 0.08;                          // frame-to-frame rise that counts as a hit
  const HIT_COOLDOWN = 0.15;                         // s before the same band can fire again
  const BEAT_SPEED = 20;                             // outward speed per unit of loudness above average
  const MAX_KICK = 8;                                // cap, under a third of a brisk pointer sweep
  const KICK_REACH = [4, 8];                         // full kicks inside 4 units of centre, none past 8
  const BASS_BANDS = 2;                              // the lowest bands, ~40-170 Hz: kick drum and bass
  const BASS_BOOST = 2;                              // bass hits kick twice as hard, with twice the cap
  const BASS_SHARE = 0.6;                            // and every ball gets this share of a bass hit

  const playButton = document.getElementById('play');
  const trackData = fetch(TRACK_URL).then((r) => r.arrayBuffer());   // start downloading now
  let audio = null;                                  // { ctx, analyser, bins, edges }
  let playing = false;
  const bandLevel = new Float32Array(BANDS);
  const bandAvg = new Float32Array(BANDS);
  const bandCool = new Float32Array(BANDS);
  const bandHit = new Float32Array(BANDS);           // kick speed this frame, 0 if no hit
  baubles.forEach((b, i) => { b.band = i % BANDS; });

  // Analyser bin index at each band edge, spaced evenly on a log scale.
  function bandEdges(sampleRate, fftSize) {
    const hzPerBin = sampleRate / fftSize;
    return Array.from({ length: BANDS + 1 }, (_, i) =>
      Math.max(1, Math.round((BAND_LO * (BAND_HI / BAND_LO) ** (i / BANDS)) / hzPerBin)));
  }

  async function startAudio() {
    const ctx = new AudioContext();
    const buffer = await ctx.decodeAudioData(await trackData);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.35;
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;                              // 16 beats at 174 bpm, loops seamlessly
    source.connect(analyser).connect(ctx.destination);
    source.start();

    const edges = bandEdges(ctx.sampleRate, analyser.fftSize);
    return { ctx, analyser, bins: new Uint8Array(analyser.frequencyBinCount), edges };
  }

  playButton.addEventListener('click', async () => {
    if (playButton.dataset.loading !== undefined) return;
    if (!audio) {
      playButton.dataset.loading = '';
      try { audio = await startAudio(); } catch (err) { console.error(err); return; }
      finally { delete playButton.dataset.loading; }
      playing = true;
    } else if (playing) {
      await audio.ctx.suspend();
      playing = false;
    } else {
      await audio.ctx.resume();
      playing = true;
    }
    playButton.setAttribute('aria-pressed', String(playing));
    playButton.setAttribute('aria-label', playing ? 'Pause track 1' : 'Play track 1');
  });

  // Once per rendered frame: turn the spectrum into band levels 0..1, keep a
  // slow average of each, and fire a hit when a band jumps above its average.
  function analyseBands(bins, edges, delta) {
    const k = 1 - Math.exp(-delta * 4);              // ~0.25 s memory for the average
    for (let b = 0; b < BANDS; b++) {
      let sum = 0;
      for (let i = edges[b]; i < edges[b + 1]; i++) sum += bins[i];
      const level = sum / (Math.max(1, edges[b + 1] - edges[b]) * 255);
      bandCool[b] -= delta;
      bandHit[b] = 0;
      if (level > bandAvg[b] && level - bandLevel[b] > ONSET_FLOOR && bandCool[b] <= 0) {
        const boost = b < BASS_BANDS ? BASS_BOOST : 1;
        bandHit[b] = Math.min(MAX_KICK * boost, BEAT_SPEED * boost * (level - bandAvg[b]));
        bandCool[b] = HIT_COOLDOWN;
      }
      bandLevel[b] = level;
      bandAvg[b] += (level - bandAvg[b]) * k;
    }
  }

  function readAudio(delta) {
    if (!playing) { bandHit.fill(0); return; }
    audio.analyser.getByteFrequencyData(audio.bins);
    analyseBands(audio.bins, audio.edges, delta);
  }

  // Raise each hit ball's outward speed to its band's kick speed. A bass hit
  // also reaches every ball, so the whole pile thumps on the kick drum.
  function applyBeatKicks() {
    let bass = 0;
    for (let b = 0; b < BASS_BANDS; b++) bass = Math.max(bass, bandHit[b]);
    for (const { body, band } of baubles) {
      const kick = Math.max(bandHit[band], bass * BASS_SHARE);
      if (!kick) continue;
      const p = body.position, v = body.velocity;
      const len = Math.hypot(p.x, p.y, p.z) || 1;
      const reach = 1 - THREE.MathUtils.clamp((len - KICK_REACH[0]) / (KICK_REACH[1] - KICK_REACH[0]), 0, 1);
      if (reach <= 0) continue;
      const nx = p.x / len, ny = p.y / len, nz = p.z / len;
      const extra = kick * reach - (v.x * nx + v.y * ny + v.z * nz);
      if (extra <= 0) continue;
      v.x += nx * extra; v.y += ny * extra; v.z += nz * extra;
    }
  }

  function viewportAtZ0() {
    const h = 2 * CAM_Z * Math.tan(THREE.MathUtils.degToRad(FOV / 2));
    return { w: h * camera.aspect, h };
  }

  // ---------------------------------------------------------------- post

  const composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType });
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new EffectPass(camera, new ToneMappingEffect({ mode: ToneMappingMode.ACES_FILMIC })));
  const ao = new N8AOPostPass(scene, camera, innerWidth, innerHeight);
  ao.configuration.aoRadius = 2;
  ao.configuration.intensity = 1;
  ao.configuration.aoSamples = 6;
  ao.configuration.denoiseSamples = 4;
  ao.configuration.halfRes = true;
  ao.configuration.color = new THREE.Color('black');
  composer.addPass(ao);
  composer.addPass(new EffectPass(camera, new SMAAEffect()));

  // ---------------------------------------------------------------- loop

  const FIXED = 1 / 60;
  const tmp = new CANNON.Vec3();
  const timer = new THREE.Clock();
  let acc = 0;

  function step(dt) {
    // Pointer: ease toward the cursor, then move the kinematic body there with
    // a matching velocity so contacts push rather than teleport.
    const vp = viewportAtZ0();
    pointerTarget.set((mouse.x * vp.w) / 2, (mouse.y * vp.h) / 2, 0);
    pointerPos.lerp(pointerTarget, 0.2);
    pointerBody.velocity.set(
      (pointerPos.x - pointerBody.position.x) / dt,
      (pointerPos.y - pointerBody.position.y) / dt,
      (pointerPos.z - pointerBody.position.z) / dt,
    );

    for (const { body, s } of baubles) {
      const p = body.position;
      const len = Math.hypot(p.x, p.y, p.z) || 1;
      tmp.set(
        (p.x / len) * PULL.x * dt * s,
        (p.y / len) * PULL.y * dt * s,
        (p.z / len) * PULL.z * dt * s,
      );
      body.applyImpulse(tmp);
    }
    world.step(dt);
  }

  function frame() {
    const delta = Math.min(0.1, timer.getDelta());

    readAudio(delta);
    applyBeatKicks();

    acc += delta;
    while (acc >= FIXED) { step(FIXED); acc -= FIXED; }

    for (const { body, group } of baubles) {
      group.position.copy(body.position);
      group.quaternion.copy(body.quaternion);
    }
    composer.render(delta);
    requestAnimationFrame(frame);
  }

  function resize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
  }
  window.addEventListener('resize', resize);

  requestAnimationFrame(frame);
  </script>
</body>
</html>
